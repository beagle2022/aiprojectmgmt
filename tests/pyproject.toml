[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pm-copilot"
version = "1.0.0"
description = "Agentic AI Project Management Copilot"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
pm-copilot = "copilot.__main__:run"

[tool.setuptools.packages.find]
include = ["copilot*"]
