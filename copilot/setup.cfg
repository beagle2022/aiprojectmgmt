[metadata]
name = ai-pm-copilot
version = 1.0.0
description = Agentic AI Project Management Copilot

[options]
packages = find:
python_requires = >=3.11
install_requires =
    anthropic>=0.40.0
    python-dotenv>=1.0.0
    requests>=2.31.0

[options.packages.find]
include =
    copilot
    copilot.*

[options.entry_points]
console_scripts =
    pm-copilot = copilot.__main__:run
